<!doctype html>
<html lang="es">
<head>
  <title>Pago no completado | Ready Express Now</title>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/styles.css?v29">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
</head>
<body class="auth-page">
  <header class="auth-header">
    <div class="auth-header-inner">
      <a class="auth-brand" href="./index.html"><img src="./images/logo-100.webp" alt="" width="36" height="36">Ready Express Now</a>
      <a class="auth-back" href="./index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Tienda</a>
    </div>
  </header>
  <main class="auth-main" id="main">
    <!-- El estado se consulta al backend: la URL de retorno de TropiPay no decide nada -->
    <section class="auth-card auth-card--center" aria-labelledby="title" aria-live="polite">
      <div id="status-icon" class="status-icon" aria-hidden="true"><i class="fa-solid fa-spinner fa-spin"></i></div>
      <h1 id="title">Verificando tu pago...</h1>
      <p id="message" class="auth-lead">Estamos consultando a TropiPay. No cierres esta ventana.</p>
      <p>Pedido <span id="order" class="status-order">-</span></p>
      <p id="error" class="auth-msg" role="alert"></p>
      <div id="actions" class="auth-actions"></div>
      <div id="other-methods" class="auth-actions payment-return-methods" hidden></div>
    </section>
  </main>
  <script type="module">
    import { initPaymentReturn } from './js/payment-return.js?v29';
    initPaymentReturn();
  </script>
</body>
</html>
