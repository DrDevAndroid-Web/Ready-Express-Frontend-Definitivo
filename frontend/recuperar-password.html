<!doctype html>
<html lang="es">
<head>
  <title>Recuperar contraseña | Ready Express Now</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/styles.css?v27">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
</head>
<body class="auth-page">
  <header class="auth-header">
    <div class="auth-header-inner">
      <a class="auth-brand" href="./index.html"><img src="./images/logo-100.webp" alt="" width="36" height="36">Ready Express Now</a>
      <a class="auth-back" href="./index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Tienda</a>
    </div>
  </header>
  <main class="auth-main" id="main">
    <section class="auth-card" aria-labelledby="page-title">
      <h1 id="page-title">Recuperar contraseña</h1>
      <p class="auth-lead">Introduce tu email y te enviaremos un enlace para crear una contraseña nueva.</p>
      <form id="form" class="auth-form" novalidate>
        <div class="auth-field"><label for="email">Email<span class="auth-required" aria-hidden="true">*</span></label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
        <p id="message" class="auth-msg" role="status"></p>
        <button type="submit" class="auth-btn">Enviar instrucciones</button>
      </form>
      <nav class="auth-links" aria-label="Opciones de cuenta">
        <a href="./login-v25.html">Volver a iniciar sesión</a>
      </nav>
    </section>
  <script type="module">
    import { requestPasswordReset } from './js/auth.js?v27';
    import { focusFirstInvalid, setLoading, showMessage } from './js/auth-ui.js?v27';
    const form = document.querySelector('#form');
    const message = document.querySelector('#message');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!focusFirstInvalid(form)) return showMessage(message, 'Introduce un email válido.', 'error');
      const button = form.querySelector('[type=submit]');
      setLoading(button, true, 'Enviando...');
      try {
        const data = Object.fromEntries(new FormData(form));
        showMessage(message, (await requestPasswordReset(data.email)).message, 'success');
      } catch (err) {
        showMessage(message, err.message, 'error');
      } finally {
        setLoading(button, false);
      }
    });
  </script>
  </main>
</body>
</html>
