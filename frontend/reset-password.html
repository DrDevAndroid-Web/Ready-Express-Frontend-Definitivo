<!doctype html>
<html lang="es">
<head>
  <title>Nueva contraseña | Ready Express Now</title>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/styles.css?v26">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
</head>
<body class="auth-page">
  <header class="auth-header">
    <div class="auth-header-inner">
      <a class="auth-brand" href="./index.html"><img src="./images/logo-100.webp" alt="" width="36" height="36">Ready Express Now</a>
      <a class="auth-back" href="./index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Tienda</a>
    </div>
  </header>
  <main class="auth-main" id="main">
    <section class="auth-card" aria-labelledby="page-title">
      <h1 id="page-title">Crea una contraseña nueva</h1>
      <p class="auth-lead">Elige una contraseña de al menos 8 caracteres.</p>
      <form id="form" class="auth-form" novalidate>
        <div class="auth-field">
          <label for="password">Nueva contraseña<span class="auth-required" aria-hidden="true">*</span></label>
          <div class="auth-password">
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
            <button type="button" class="auth-password-toggle" data-password-toggle aria-controls="password" aria-pressed="false" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="auth-field">
          <label for="confirm">Repite la contraseña<span class="auth-required" aria-hidden="true">*</span></label>
          <div class="auth-password">
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8">
            <button type="button" class="auth-password-toggle" data-password-toggle aria-controls="confirm" aria-pressed="false" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </div>
        </div>
        <p id="message" class="auth-msg" role="alert"></p>
        <button type="submit" class="auth-btn">Guardar contraseña</button>
      </form>
      <nav class="auth-links" aria-label="Opciones de cuenta">
        <a href="./recuperar-password.html">Solicitar un enlace nuevo</a>
      </nav>
    </section>
  <script type="module">
    import { resetPassword } from './js/auth.js?v26';
    import { bindPasswordToggles, focusFirstInvalid, setLoading, showMessage } from './js/auth-ui.js?v26';
    bindPasswordToggles();
    const form = document.querySelector('#form');
    const message = document.querySelector('#message');
    const button = form.querySelector('[type=submit]');

    // Supabase devuelve el token de recuperación en el fragmento (#access_token=...&type=recovery)
    const hash = new URLSearchParams(location.hash.slice(1));
    const recoveryToken = hash.get('access_token');
    const hashError = hash.get('error_description');
    // Quitar el token de la barra de direcciones y del historial
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);

    if (!recoveryToken) {
      showMessage(message, hashError || 'El enlace no es válido o ya fue usado. Solicita uno nuevo.', 'error');
      button.disabled = true;
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!recoveryToken) return;
      if (!focusFirstInvalid(form)) return showMessage(message, 'La contraseña debe tener al menos 8 caracteres.', 'error');
      const data = Object.fromEntries(new FormData(form));
      if (data.password !== data.confirm) {
        const confirm = document.querySelector('#confirm');
        confirm.setAttribute('aria-invalid', 'true');
        confirm.focus();
        return showMessage(message, 'Las contraseñas no coinciden.', 'error');
      }
      setLoading(button, true, 'Guardando...');
      try {
        showMessage(message, (await resetPassword(recoveryToken, data.password)).message, 'success');
        form.querySelectorAll('input').forEach(input => input.disabled = true);
        setTimeout(() => location.href = './login-v25.html', 1500);
      } catch (err) {
        showMessage(message, err.message, 'error');
        setLoading(button, false);
      }
    });
  </script>
  </main>
</body>
</html>
