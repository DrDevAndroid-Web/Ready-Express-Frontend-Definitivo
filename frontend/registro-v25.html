<!doctype html>
<html lang="es">
<head>
  <title>Crear cuenta | Ready Express Now</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/styles.css?v26">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
</head>
<body class="auth-page">
  <header class="auth-header">
    <div class="auth-header-inner">
      <a class="auth-brand" href="./index.html"><img src="./images/logo-100.webp" alt="" width="36" height="36">Ready Express Now</a>
      <a class="auth-back" href="./index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Tienda</a>
    </div>
  </header>
  <main class="auth-main" id="main">
    <section class="auth-card auth-card--wide" aria-labelledby="page-title">
      <h1 id="page-title">Crear cuenta</h1>
      <p class="auth-lead">Completa estos datos para coordinar tus entregas y pagos TropiPay. Los campos con <span class="auth-required" aria-hidden="true">*</span> son obligatorios.</p>
      <form id="form" class="auth-form" novalidate>
        <div class="auth-row">
          <div class="auth-field"><label for="nombre">Nombre<span class="auth-required" aria-hidden="true">*</span></label><input id="nombre" name="nombre" autocomplete="given-name" required></div>
          <div class="auth-field"><label for="apellidos">Apellidos<span class="auth-required" aria-hidden="true">*</span></label><input id="apellidos" name="apellidos" autocomplete="family-name" required></div>
        </div>
        <div class="auth-row">
          <div class="auth-field"><label for="email">Email<span class="auth-required" aria-hidden="true">*</span></label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
          <div class="auth-field"><label for="telefono">Teléfono<span class="auth-required" aria-hidden="true">*</span></label><input id="telefono" name="telefono" type="tel" autocomplete="tel" inputmode="tel" required></div>
        </div>
        <div class="auth-field">
          <label for="password">Contraseña<span class="auth-required" aria-hidden="true">*</span></label>
          <div class="auth-password">
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-hint">
            <button type="button" class="auth-password-toggle" data-password-toggle aria-controls="password" aria-pressed="false" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </div>
          <small id="password-hint" class="auth-hint">Mínimo 8 caracteres.</small>
        </div>
        <fieldset class="auth-fieldset">
          <legend>Dirección principal de entrega</legend>
          <div class="auth-field"><label for="alias">Alias<span class="auth-required" aria-hidden="true">*</span></label><input id="alias" name="alias" placeholder="Ej.: Casa de mamá" required></div>
          <div class="auth-field"><label for="direccion">Dirección completa<span class="auth-required" aria-hidden="true">*</span></label><input id="direccion" name="direccion" autocomplete="street-address" required></div>
          <div class="auth-row">
            <div class="auth-field"><label for="provincia">Provincia<span class="auth-required" aria-hidden="true">*</span></label><input id="provincia" name="provincia" value="Guantánamo" required></div>
            <div class="auth-field"><label for="municipio">Municipio<span class="auth-required" aria-hidden="true">*</span></label><input id="municipio" name="municipio" value="Guantánamo" required></div>
          </div>
          <div class="auth-field"><label for="referencia">Referencia</label><input id="referencia" name="referencia" placeholder="Ej.: frente al parque"></div>
        </fieldset>
        <p id="error" class="auth-msg" role="alert"></p>
        <button type="submit" class="auth-btn">Registrarme</button>
      </form>
      <nav class="auth-links" aria-label="Opciones de cuenta">
        <a href="./login-v25.html">¿Ya tienes cuenta? Inicia sesión</a>
      </nav>
    </section>
  <script type="module">
    import { registerCustomer, createMyAddress } from './js/auth.js?v26';
    import { bindPasswordToggles, focusFirstInvalid, setLoading, showMessage } from './js/auth-ui.js?v26';
    bindPasswordToggles();
    const form = document.querySelector('#form');
    const message = document.querySelector('#error');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!focusFirstInvalid(form)) return showMessage(message, 'Revisa el campo marcado: es obligatorio o tiene un formato inválido.', 'error');
      const button = form.querySelector('[type=submit]');
      const data = Object.fromEntries(new FormData(form));
      showMessage(message, '');
      setLoading(button, true, 'Creando cuenta...');
      try {
        const result = await registerCustomer(data);
        if (result.access_token) await createMyAddress({ alias: data.alias, direccion: data.direccion, provincia: data.provincia, municipio: data.municipio, referencia: data.referencia, telefono_contacto: data.telefono, es_predeterminada: true });
        showMessage(message, result.email_confirmation_required ? 'Cuenta creada. Confirma tu email y luego inicia sesión.' : 'Cuenta creada correctamente.', 'success');
        setTimeout(() => location.href = result.access_token ? './cuenta.html' : './login-v25.html', 900);
      } catch (err) {
        showMessage(message, err.message, 'error');
        setLoading(button, false);
      }
    });
  </script>
  </main>
</body>
</html>
