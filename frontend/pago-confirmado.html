<!doctype html>
<html lang="es">
<head>
  <title>Estado del pago | Ready Express Now</title>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/styles.css?v26">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
</head>
<body class="auth-page">
  <header class="auth-header">
    <div class="auth-header-inner">
      <a class="auth-brand" href="./index.html"><img src="./images/logo-100.webp" alt="" width="36" height="36">Ready Express Now</a>
      <a class="auth-back" href="./index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Tienda</a>
    </div>
  </header>
  <main class="auth-main" id="main">
    <section class="auth-card auth-card--center" aria-labelledby="title" aria-live="polite">
      <div id="status-icon" class="status-icon" aria-hidden="true"><i class="fa-solid fa-hourglass-half"></i></div>
      <h1 id="title">Estamos procesando tu pago</h1>
      <p id="message" class="auth-lead">Estamos confirmando la información con el proveedor. No cierres esta ventana.</p>
      <p>Pedido <span id="order" class="status-order">-</span></p>
      <div class="auth-actions">
        <a id="receipt" class="auth-btn" href="./pago.html" hidden>Subir comprobante manual</a>
        <a class="auth-btn auth-btn--secondary" href="./index.html">Volver a la tienda</a>
        <a class="auth-btn auth-btn--secondary" href="./cuenta.html">Ver mis pedidos</a>
      </div>
    </section>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const state = params.get('estado') || 'procesando';
    document.querySelector('#order').textContent = params.get('order') || '-';
    const title = document.querySelector('#title');
    const message = document.querySelector('#message');
    const icon = document.querySelector('#status-icon');
    const setIcon = (name, type) => {
      icon.className = type ? `status-icon is-${type}` : 'status-icon';
      icon.innerHTML = `<i class="fa-solid ${name}"></i>`;
    };
    if (state === 'revision') { title.textContent = 'Pedido recibido'; message.textContent = 'Tu pedido fue creado. El pago queda pendiente de revisión o de la confirmación del método seleccionado.'; document.querySelector('#receipt').hidden = false; setIcon('fa-clipboard-check'); }
    if (state === 'confirmado') { title.textContent = 'Pago confirmado'; message.textContent = 'Tu pago fue confirmado y la orden pasó a preparación.'; setIcon('fa-circle-check', 'success'); }
    if (state === 'rechazado') { title.textContent = 'Pago rechazado'; message.textContent = 'TropiPay no pudo confirmar el pago. Puedes intentarlo nuevamente.'; setIcon('fa-circle-xmark', 'error'); }
  </script>
  </main>
</body>
</html>
